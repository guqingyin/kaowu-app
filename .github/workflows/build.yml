name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KAOWU_KEYSTORE_B64 }}" | base64 -d > keystore-kaowu.p12
          ls -la keystore-kaowu.p12

      - name: Build signed release APK
        env:
          KAOWU_STORE_PASS: ${{ secrets.KAOWU_STORE_PASS }}
          KAOWU_KEY_ALIAS: ${{ secrets.KAOWU_KEY_ALIAS }}
          KAOWU_KEY_PASS: ${{ secrets.KAOWU_KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify signature
        continue-on-error: true
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          SIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name apksigner -type f 2>/dev/null | head -1)
          echo "apksigner: $SIGNER"
          if [ -n "$SIGNER" ]; then "$SIGNER" verify --print-certs "$APK" | head -8; fi

      - name: Collect APK
        run: |
          mkdir -p export
          ls -la app/build/outputs/apk/release/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk export/kaowu-3.3.2.apk
          else
            echo "::error::没有生成已签名的 app-release.apk，签名配置未生效"
            exit 1
          fi
          ls -la export

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: export/kaowu-3.3.2.apk
          tag_name: v3.3.2
          name: 惠城院考务中心 v3.3.2（恢复 v2.7.0 后台保活架子）
          body: |
            - 后台通知链路恢复为 v2.7.0 验证过的方式：前台服务只负责保活，Activity 每 15 秒唤起网页轮询，网页通过原生桥发系统通知
            - 服务不再查数据库、不再依赖登录凭证与请求头，去掉了 3.0~3.3.1 那套复杂链路
            - 服务启动改回 startService，避开部分 ROM 对 startForegroundService 的 5 秒超时杀进程
            - 保留固定证书签名、QQ 风格提示音、通知自检、年级、客户端分布等全部新功能
            - 注意：若当前装的是 v2.7.0（早期调试签名），需先卸载一次才能装；之后升级都不用卸载
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
