name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p export
          cp app/build/outputs/apk/debug/app-debug.apk export/kaowu-2.8.0.apk
          ls -la export

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: export/kaowu-2.8.0.apk
          tag_name: v2.8.0
          name: 惠城院考务中心 v2.8.0（自定义提示音）
          body: |
            - 新增：自定义消息提示音（双音叮咚）+ 震动
            - 新增：原生定时唤起网页轮询，绕过后台定时器冻结
            - 修复：首次打开即请求系统通知权限（Android 13+）
            - 注意：请先卸载旧版本再安装本版本
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
