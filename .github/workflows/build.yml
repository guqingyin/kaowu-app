name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KAOWU_KEYSTORE_B64 }}" | base64 -d > keystore-kaowu.p12
          ls -la keystore-kaowu.p12

      - name: Build signed release APK
        env:
          KAOWU_STORE_PASS: ${{ secrets.KAOWU_STORE_PASS }}
          KAOWU_KEY_ALIAS: ${{ secrets.KAOWU_KEY_ALIAS }}
          KAOWU_KEY_PASS: ${{ secrets.KAOWU_KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify signature
        continue-on-error: true
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          SIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name apksigner -type f 2>/dev/null | head -1)
          echo "apksigner: $SIGNER"
          if [ -n "$SIGNER" ]; then "$SIGNER" verify --print-certs "$APK" | head -8; fi

      - name: Collect APK
        run: |
          mkdir -p export
          ls -la app/build/outputs/apk/release/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk export/kaowu-3.3.1.apk
          else
            echo "::error::没有生成已签名的 app-release.apk，签名配置未生效"
            exit 1
          fi
          ls -la export

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: export/kaowu-3.3.1.apk
          tag_name: v3.3.1
          name: 惠城院考务中心 v3.3.1（后台通知修复版）
          body: |
            - 修复后台收不到通知：原生轮询的凭证请求头写错，导致所有后台请求被网关 401 拒绝
            - 登录凭证可自动续期，长期不打开 App 也不会失效
            - 服务自己创建通知渠道（含 QQ 风格提示音），冷启动被系统拉起也能响
            - 云端可查原生服务心跳日志，便于确认后台是否真的在跑
            - 固定证书签名，可直接覆盖安装，不用卸载
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
