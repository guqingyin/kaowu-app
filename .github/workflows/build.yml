name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p export
          cp app/build/outputs/apk/debug/app-debug.apk export/kaowu-2.6.0.apk
          ls -la export

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: export/kaowu-2.6.0.apk
          tag_name: v2.6.0
          name: 惠城院考务中心 v2.6.0（修复系统通知）
          body: |
            - 修复：首次打开即请求系统通知权限（Android 13+ 必需）
            - 修复：网页通知桥接（AndroidNotify.post / requestPermission）
            - 保留：定位签到、聊天图片/视频上传、文件下载
            - 注意：因签名更换，请先卸载旧版本再安装本版本
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
