plugins { id 'com.android.application' }

android {
    namespace 'com.workbuddy.dailytrail'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workbuddy.dailytrail'
        minSdk 24
        targetSdk 34
        versionCode 28
        versionName '2.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
